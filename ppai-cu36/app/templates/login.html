{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Iniciar sesión</h1>
  <p class="ayuda">Inicio de sesión simulado: seleccioná el usuario.</p>
  <form method="post">
    <label for="usuario_id">Usuario</label>
    <select name="usuario_id" id="usuario_id" required>
      {% for e in empleados %}
      <option value="{{ e.usuario.id }}">{{ e.usuario.nombreUsuario }} — {{ e.getNombreCompleto() }} ({{ e.rol.nombre }}, {{ e.getCM().getNombre() }})</option>
      {% endfor %}
    </select>
    <button type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
